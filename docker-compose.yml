# Всё окружение проекта. Настройки — только через .env (см. .env.example).
name: mama

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  # Сервис векторов (embed). Пусто — фейковый провайдер, поиск по смыслу не работает.
  EMBED_URL: http://embed:80

# Логи контейнеров: не больше 100 МБ на сервис; по времени — logrotate, 30 дней (infra/logrotate, ТЗ 11.5).
x-logging: &logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

services:
  postgres:
    # postgres:16-alpine + pgvector (infra/postgres/Dockerfile). Перед первой сменой образа на сервере — бэкап.
    build: ./infra/postgres
    image: mama-postgres:16-pgvector
    restart: unless-stopped
    logging: *logging
    # GlitchTip (профиль monitoring) держит секционированные таблицы — ему нужно больше блокировок.
    command: ['postgres', '-c', 'max_locks_per_transaction=512']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Своя модель векторов для поиска по смыслу (ТЗ 10.1, решение Льва Л7): запросы мам не уходят с сервера.
  # Порт наружу не открыт. При первом запуске скачивает модель (~0,5 ГБ) с Hugging Face в том embedmodels.
  # Другая модель — EMBED_MODEL; если у неё другая размерность, нужна миграция (EMBED_DIMS в shared).
  embed:
    logging: *logging
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    # Ограничения под VPS 2 vCPU / 6 ГБ: без них сервис занимает гигабайты на прогрев больших пакетов.
    command:
      - --model-id=${EMBED_MODEL:-intfloat/multilingual-e5-small}
      - --port=80
      - --tokenization-workers=1
      - --max-batch-tokens=4096
      - --max-concurrent-requests=16
      - --max-client-batch-size=16
      - --auto-truncate
    environment:
      OMP_NUM_THREADS: '2'
    mem_limit: 1500m
    volumes:
      - embedmodels:/data

  migrate:
    logging: *logging
    build: { context: ., target: migrate }
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  web:
    logging: *logging
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      # Медиа на диске, если S3 не настроен (S3_BUCKET пуст).
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    logging: *logging
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Временный https-адрес для проверки на телефоне без домена:
  # docker compose --profile tunnel up -d cloudflared && docker compose logs cloudflared | grep trycloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    command: ['tunnel', '--no-autoupdate', '--url', 'http://web:3000']
    depends_on:
      - web

  # Мониторинг (ТЗ 13): docker compose --profile monitoring up -d. Интерфейсы — только через SSH-туннель:
  # ssh -L 8000:127.0.0.1:8000 -L 3001:127.0.0.1:3001 сервер → http://localhost:8000 (GlitchTip), :3001 (Uptime Kuma).
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    profiles: ['monitoring']
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      PORT: '8000'
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      GLITCHTIP_EMBED_WORKER: 'True'
      VALKEY_URL: redis://redis:6379/1
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: glitchtip@localhost
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: { condition: service_healthy }

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8
    profiles: ['monitoring']
    restart: unless-stopped
    logging: *logging
    volumes:
      - kuma:/app/data
    ports: ['127.0.0.1:3001:3001']

volumes:
  embedmodels:
  kuma:
  media:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
